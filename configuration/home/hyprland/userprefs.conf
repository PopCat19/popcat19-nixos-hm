# userprefs.conf
#
# Purpose: Configure input devices, shaders, monitor controls, and hardware bindings
#
# This config:
# - Sets keyboard, mouse, and touchpad preferences
# - Binds shader toggle shortcuts
# - Configures monitor brightness and DPMS controls
# - Launches startup applications

input {
    kb_layout = us
    follow_mouse = 1
    mouse_refocus = true
    accel_profile = flat
    sensitivity = 0.8
    force_no_accel = 1
    scroll_factor = 0.3
    numlock_by_default = true
    touchpad {
        scroll_factor = 0.2
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = false
        middle_button_emulation = true
    }
}

device {
    name = synaptics-tm3276-022
    sensitivity = 1.96
    accel_profile = flat
}

device {
    name = logitech-k400-plus-1
    sensitivity = 1.0
    natural_scroll = true
}

bind = Alt+Super,N,exec,~/.config/hypr/scripts/hyprsunset-toggle.sh
bind = Alt+Super,M,exec,hyprshade toggle $NIXOS_CONFIG_DIR/configuration/home/hyprland/shaders/cool-stuff.glsl
bind = Alt+Super,B,exec,hyprshade toggle $NIXOS_CONFIG_DIR/configuration/home/hyprland/shaders/bloom.glsl

bind = Alt+Super,K,exec,ddcutil --bus 7 setvcp 10 0 && ddcutil --bus 8 setvcp 10 0 && ddcutil --bus 10 setvcp 10 0
bind = Alt+Super,K,exec,ddcutil --bus 7 setvcp 12 80 && ddcutil --bus 8 setvcp 12 80 && ddcutil --bus 10 setvcp 12 0
bind = Alt+Super,L,exec,ddcutil --bus 7 setvcp 10 80 && ddcutil --bus 8 setvcp 10 80 && ddcutil --bus 10 setvcp 10 80
bind = Alt+Super,L,exec,ddcutil --bus 7 setvcp 12 80 && ddcutil --bus 8 setvcp 12 80 && ddcutil --bus 10 setvcp 12 48
bind = Alt+Super,O,exec,ddcutil --bus 7 setvcp 10 100 && ddcutil --bus 8 setvcp 10 100 && ddcutil --bus 10 setvcp 10 100
bind = Alt+Super,O,exec,ddcutil --bus 7 setvcp 12 100 && ddcutil --bus 8 setvcp 12 100 && ddcutil --bus 10 setvcp 12 80

bind = Alt+Super,F10,exec,ddcutil --display 1 setvcp 10 0 && ddcutil --display 1 setvcp 12 80
bind = Alt+Super,F11,exec,ddcutil --display 1 setvcp 10 80 && ddcutil --display 1 setvcp 12 80
bind = Alt+Super,F12,exec,ddcutil --display 1 setvcp 10 100 && ddcutil --display 1 setvcp 12 100

bind = Alt+Super,J,exec,hyprctl dispatch dpms toggle
bind = Alt+Super,K,exec,hyprctl dispatch dpms on
bind = Alt+Super,L,exec,hyprctl dispatch dpms on
bind = Alt+Super,O,exec,hyprctl dispatch dpms on

exec-once = fcitx5
windowrule = min_size 1024 600, match:class ^(org.pulseaudio.pavucontrol)$

bind = Alt+Super,V,exec,pavucontrol

bindel = , f9, exec, wayvncctl output-cycle
bind = Alt+Super,f9,exec,pkill wayvnc
bind = Super,f9,exec,wayvnc 0.0.0.0 -o DP-3

bind = Alt+Super,O,exec,openrgb --device MSI --mode static --color $(tail -c +2 $HOME/.config/openrgb/pmd-led-color) --brightness 100
bind = Alt+Super,L,exec,openrgb --device MSI --mode static --color $(tail -c +2 $HOME/.config/openrgb/pmd-led-color) --brightness 100
bind = Alt+Super,J,exec,openrgb --device MSI --mode static --color $(tail -c +2 $HOME/.config/openrgb/pmd-led-color) --brightness 0
bind = Alt+Super,K,exec,openrgb --device MSI --mode static --color $(tail -c +2 $HOME/.config/openrgb/pmd-led-color) --brightness 40

windowrule = float on, match:class Waydroid
