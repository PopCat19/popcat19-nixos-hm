# monitors.conf
#
# Purpose: Monitor configuration for thinkpad0 with external display
#
# This module:
# - Configures built-in eDP-1 display at 1920x1080@60Hz
# - Configures external HDMI-1 monitor

monitor=eDP-1, 1920x1080@60.00, 0x0, 1
monitor=HDMI-1, 1920x1080@60.00, 1920x0, 1
monitor=,preferred,auto,auto
