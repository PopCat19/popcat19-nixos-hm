# monitors.conf
#
# Purpose: Monitor configuration for surface0 built-in display
#
# This module:
# - Configures external monitor as primary
# - Disables internal display (eDP-1)

monitor=HDMI-A-2,1920x1080@60.00, 0x0, 1
monitor=eDP-1,disable
monitor=,preferred,auto,auto

workspace = 1, monitor:HDMI-A-2, default:true
