# monitors.conf
#
# Purpose: Monitor configuration for nixos0 dual-monitor setup
#
# This module:
# - Configures primary DP-3 monitor at 1920x1080@165Hz
# - Configures secondary HDMI-A-1 monitor rotated 90 degrees

monitor=DP-3, 1920x1080@165.00, 0x0, 1
monitor=HDMI-A-1, 1920x1080@60.00, 1920x-560, 1, transform, 1
monitor=,preferred,auto,auto
